version: "3.9"

services:
  app:
    image: whatsapp-nextjs-api:local
    ports:
      - "3000:3000"
    container_name: whatsapp-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/data/dev.db"
      NODE_ENV: production
      # Optional tuning
      PRISMA_LOG_QUERY: "0"
      WA_DEVICE_LABEL: "Steven Api"
      # Force ws to use pure-JS implementations to avoid native module issues in bundled output
      WS_NO_BUFFER_UTIL: "1"
      WS_NO_UTF_8_VALIDATE: "1"
      # Webhooks pour la synchronisation avec la plateforme admin
      OUTBOUND_WEBHOOK_URL: ${OUTBOUND_WEBHOOK_URL:-http://localhost:8000}
      OUTBOUND_WEBHOOK_KEY: ${OUTBOUND_WEBHOOK_KEY:-f035c3c5f1bc61d9fc7d39aee9e92acb4b318299ae8}
      INBOUND_WEBHOOK_KEY: ${INBOUND_WEBHOOK_KEY:-f035c3c5f1bc61d9fc7d39aee9e92acb4b318299ae8}
    volumes:
      - ${DATA_VOLUME}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s