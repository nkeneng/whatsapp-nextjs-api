version: "3.9"

services:
  app:
    image: ghcr.io/nkeneng/whatsapp-nextjs-api:${IMAGE_TAG}
    container_name: whatsapp-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/data/dev.db"
      NODE_ENV: production
      # Optional tuning
      PRISMA_LOG_QUERY: "0"
      WA_DEVICE_LABEL: "Steven Api"
      # Forward incoming messages to the Zone Travel admin (empty key = disabled)
      INBOUND_WEBHOOK_URL: "${INBOUND_WEBHOOK_URL:-https://admin.zone-travel.net/api/webhooks/whatsapp-inbound}"
      INBOUND_WEBHOOK_KEY: "${INBOUND_WEBHOOK_KEY:-}"
      INBOUND_WEBHOOK_SESSIONS: "${INBOUND_WEBHOOK_SESSIONS:-zone}"
      # Force ws to use pure-JS implementations to avoid native module issues in bundled output
      WS_NO_BUFFER_UTIL: "1"
      WS_NO_UTF_8_VALIDATE: "1"
    volumes:
      - ${DATA_VOLUME}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s