name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  DOCKER_REGISTRY: ghcr.io/nkeneng
  IMAGE_NAME: whatsapp-nextjs-api 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for versioning

    - name: Generate version tag
      id: version
      run: |
        # Generate version from git
        if git describe --tags --exact-match 2>/dev/null; then
          VERSION=$(git describe --tags --exact-match)
        else
          BRANCH=${GITHUB_REF#refs/heads/}
          SHORT_SHA=${GITHUB_SHA::8}
          VERSION="${BRANCH}-${SHORT_SHA}"
        fi
        
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        target: runner
        push: true
        tags: |
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Update Dokploy project environment
      uses: nkeneng/dokploy-update-env-gha@2.0
      with:
        dokploy_url: ${{ secrets.DOKPLOY_URL }}
        api_key: ${{ secrets.DOKPLOY_API_KEY }}
        resource_type: project
        resource_id: ${{ secrets.DOKPLOY_PROJECT_ID }}
        env_name: IMAGE_TAG
        env_value: ${{ steps.version.outputs.VERSION }}

    - name: Deploy to Dokploy
      uses: ahmedabdou14/dokploy-deploy-gha@1.1.0
      with:
        dokploy_url: ${{ secrets.DOKPLOY_URL }}
        auth_token: ${{ secrets.DOKPLOY_API_KEY }}
        compose_id: ${{ secrets.DOKPLOY_COMPOSE_ID }}