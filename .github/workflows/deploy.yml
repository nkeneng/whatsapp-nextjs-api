name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  DOCKER_REGISTRY: ghcr.io/nkeneng
  IMAGE_NAME: whatsapp-nextjs-api 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for versioning

    - name: Generate version tag
      id: version
      run: |
        # Generate version from git
        if git describe --tags --exact-match 2>/dev/null; then
          VERSION=$(git describe --tags --exact-match)
        else
          BRANCH=${GITHUB_REF#refs/heads/}
          SHORT_SHA=${GITHUB_SHA::8}
          VERSION="${BRANCH}-${SHORT_SHA}"
        fi
        
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        target: runner
        push: true
        tags: |
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Update Dokploy project environment
      run: |
        curl -X POST \
          '${{ secrets.DOKPLOY_URL }}/api/project.update' \
          -H 'x-api-key: ${{ secrets.DOKPLOY_API_KEY }}' \
          -H 'Content-Type: application/json' \
          -d '{
            "projectId": "${{ secrets.DOKPLOY_PROJECT_ID }}",
            "env": "IMAGE_TAG=${{ steps.version.outputs.VERSION }}"
          }' \
          --fail --show-error

    - name: Trigger Dokploy Deployment
      run: |
        curl -X POST \
          '${{ vars.DOKPLOY_URL }}/api/compose.deploy' \
          -H 'accept: application/json' \
          -H 'x-api-key: ${{ secrets.DOKPLOY_API_KEY }}' \
          -H 'Content-Type: application/json' \
          -d '{
            "composeId": "${{ secrets.DOKPLOY_COMPOSE_ID }}"
          }' \
          --fail --show-error